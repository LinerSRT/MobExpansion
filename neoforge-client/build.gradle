plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev'
}
base {
    archivesName = mod_id
}
neoForge {
    version = project.neo_version
    accessTransformers {
        file("src/main/resources/META-INF/accesstransformer.cfg")
    }
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "curse.maven:emi-580555:8081408" //1.1.24+1.21.1
    implementation "curse.maven:rhino-416294:8218748" //2101.2.7-build.85
    implementation "curse.maven:kubejs-238086:8083208" //2101.7.2-build.368
    implementation "curse.maven:lootjs-570630:6867813" //1.21.1-3.4.3
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${gecko_lib_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
sourceSets.main.resources {
    srcDir "src/generated/resources"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            version = mod_version
            from components.java
            pom.withXml {
                asNode().remove(asNode().dependencies)
            }
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}


tasks.named('jar', Jar) {
    archiveClassifier.set('client')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':neoforge-server').sourceSets.main.output
}

tasks.named("processResources") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def syncTask(String taskName, String envToken) {
    return tasks.register("sync${taskName.capitalize()}Client") {
        group = "build"
        description = "Sync $taskName client folders"
        doLast {
            def output = new ByteArrayOutputStream()
            def error = new ByteArrayOutputStream()
            def token = System.getenv(envToken)
            if (!token)
                throw new GradleException("Environment variable ${envToken} is not set!")
            exec {
                commandLine(
                        'curl',
                        'https://auth.mcskill.net/panel/sync',
                        '-X', 'POST',
                        '-H', 'Content-Type: application/json',
                        '-H', "X-Token: ${token}"
                )
                standardOutput = output
                errorOutput = error
                ignoreExitValue = true
            }
            println("Starting sync for ${taskName}...")
            def outputString = output.toString().trim()
            if (outputString == '{"status":"ok"}') {
                println("✅ Sync finished successfully for ${taskName}!")
            } else {
                throw new GradleException("❌ Failed to sync ${taskName}! Cause: ${outputString}")
            }
        }
    }
}

syncTask("Frozen", "FROZEN_CLIENT_TOKEN")
syncTask("Industrial", "INDUSTRIAL_CLIENT_TOKEN")
syncTask("FrozenTest", "FROZEN_TEST_CLIENT_TOKEN")
syncTask("IndustrialTest", "INDUSTRIAL_TEST_CLIENT_TOKEN")
